services:
  orbita:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/prod.db
      - JWT_SECRET=${JWT_SECRET:-orbita-hackathon-production-secret-key-2026}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
    volumes:
      - orbita_sqlite_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  orbita_sqlite_data:
