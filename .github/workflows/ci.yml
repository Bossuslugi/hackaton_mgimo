name: CI — Build, Security & Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Build & AppSec Smoke Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
      JWT_SECRET: ci-github-actions-secret-key-32-chars-min!
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client & validate schema
        run: |
          npx prisma generate
          npx prisma validate

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Setup & seed CI SQLite database
        run: |
          npx prisma db push --skip-generate
          npx tsx prisma/seed.ts

      - name: Build Next.js production bundle
        run: npm run build

      - name: Run API, Business Logic & Anti-IDOR smoke tests
        run: npm run test:smoke

  docker:
    name: Docker Build & Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config

      - name: Build production Docker image
        run: docker build -t orbita-ci .
